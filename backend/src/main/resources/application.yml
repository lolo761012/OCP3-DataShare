spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: datashare-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/${DATASHARE_DB_NAME:datashare}
    username: ${DATASHARE_DB_USER:datashare}
    password: ${DATASHARE_DB_PASSWORD:datashare}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1030MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

datashare:
  storage:
    path: ${DATASHARE_STORAGE_PATH:../storage/files}

jwt:
  secret-key: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
