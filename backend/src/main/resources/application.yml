spring:
  application:
    name: datashare-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/${DATASHARE_DB_NAME:datashare}
    username: ${DATASHARE_DB_USER:datashare}
    password: ${DATASHARE_DB_PASSWORD:datashare}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

datashare:
  storage:
    path: ${DATASHARE_STORAGE_PATH:../storage/files}
